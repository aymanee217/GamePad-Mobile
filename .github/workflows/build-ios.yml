name: Build iOS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: GamePad-Mobile/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: xcodebuild -version

      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry GamePad_Mobile.ipa Payload/
          test -f GamePad_Mobile.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GamePad-Mobile-unsigned-ipa
          path: GamePad-Mobile/mobile/GamePad_Mobile.ipa
          if-no-files-found: error
          retention-days: 14
